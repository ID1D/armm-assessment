<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}ARMM Assessment{% endblock %}</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #f8f9fa;
    }
    main {
      flex: 1;
    }
    .navbar-brand {
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    footer {
      background-color: #212529;
      color: #adb5bd;
      font-size: 0.85rem;
    }
    footer a {
      color: #adb5bd;
      text-decoration: none;
    }
    footer a:hover {
      color: #fff;
    }

    /* Print styles */
    @media print {
      .navbar,
      .no-print,
      .btn,
      .nav-tabs,
      footer .btn {
        display: none !important;
      }
      .accordion-collapse {
        display: block !important;
      }
      .accordion-button::after {
        display: none;
      }
      body {
        background: #fff;
      }
      .card {
        border: 1px solid #dee2e6 !important;
      }
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-dark bg-dark no-print">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('index') }}">
        ARMM Assessment
      </a>
      <span class="navbar-text text-secondary small">
        AI SOC Maturity Framework
      </span>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="py-4 mt-5">
    <div class="container text-center">
      <p class="mb-1">
        ARMM Framework &mdash; AI Response Maturity Model
      </p>
      <p class="mb-0">
        Created by
        <strong>Andrei Cotaie</strong>,
        <strong>Cristian Miron</strong> &amp;
        <strong>Filip Stojkovski</strong>
      </p>
    </div>
  </footer>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmROO3W38dJdcCKnJCi9U5iq2FD"
    crossorigin="anonymous"
  ></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
